name: Refresh content and rebuild

on:
  schedule:
    - cron: '23 4 * * *'   # every day, 04:23 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch research headlines and videos
        run: python scripts/refresh.py
      - name: Rebuild the pages
        run: python build/build.py
      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            echo "pushed=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Daily refresh: research radar, video shelf, rebuilt pages"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "pushed=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        # GitHub Pages serves this site from the branch chosen in Settings > Pages.
        # While that branch is gh-pages, keep it identical to main. Once Pages is switched to main, this step only requests a build.
        continue-on-error: true
        run: |
          source=$(gh api "repos/${{ github.repository }}/pages" --jq '.source.branch' || echo "")
          echo "Pages publishes from: ${source:-unknown}"
          if [ "$source" = "gh-pages" ]; then
            git push --force origin HEAD:gh-pages
          fi
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
